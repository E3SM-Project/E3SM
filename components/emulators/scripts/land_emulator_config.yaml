emulator:
  name: lnd-emulator
  type: component
  model:
    path: land_emulator.pt
    input_layout: FeatureMajor
    output_layout: FeatureMajor
    backend: libtorch
    options:
      dtype: float64
sample_space:
  dimensions:
  - column
  - soil_levels
input_order:
- temperature
- soil_moisture
output_order:
- surface_flux
inputs:
  temperature:
    name: temperature
    attributes:
      attname: temperature
      longname: Atmospheric temperature
      stdname: air_temperature
      units: K
    dimensions:
    - column
  soil_moisture:
    name: soil_moisture
    attributes:
      attname: soil_moisture
      longname: Soil Moisture
      stdname: soil_moisture
      units: h2o kg m-2
    dimensions:
    - column
    - soil_levels
outputs:
  surface_flux:
    name: surface_flux
    attributes:
      attname: surface_flux
      longname: Surface Flux to atm
      stdname: energy
      units: W m-2
    dimensions:
    - column
