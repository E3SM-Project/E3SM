fields:
  temperature:
    kind: state
    name: temperature
    merge_type: direct
    attributes:
      attname: temperature
      longname: Atmospheric temperature
      stdname: air_temperature
      units: K
    sources:
      - forcing-emulator
    destinations:
      - lnd-emulator
  surface_flux:
    kind: flux
    name: surface_flux
    merge_type: direct
    attributes:
      attname: surface_flux
      longname: Surface energy flux
      stdname: Sef
      units: W m-2
    sources:
    - forcing-emulator
    destinations:
    - lnd-emulator
  soil_moisture:
    kind: state
    name: soil_moisture
    merge_type: direct
    attributes:
      attname: soil_moisture
      longname: soil_moisture
      stdname: Sa_prec
      units: kg m-2 s-1
    sources:
    - forcing-emulator
    destinations:
    - lnd-emulator
