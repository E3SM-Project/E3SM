emulator:
  name: forcing-emulator
  type: component
  model:
    path: forcing_emulator.pt
    input_layout: FeatureMajor
    output_layout: FeatureMajor
    backend: libtorch
    options:
      dtype: float64
sample_space:
  dimensions:
  - column
  - soil_levels
input_order:
- surface_flux
output_order:
- temperature
- soil_moisture
inputs:
  surface_flux:
    name: surface_flux
    dimensions:
    - column
outputs:
  temperature:
    name: temperature
    dimensions:
    - column
  soil_moisture:
    name: soil_moisture
    dimensions:
    - column
    - soil_levels
