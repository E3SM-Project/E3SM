fields:
  temperature:
    kind: state
    name: temperature
    merge_type: direct
    attributes:
      attname: temperature
      longname: Atmospheric temperature
      stdname: air_temperature
      units: K
    sources:
    - forcing-emulator
    destinations:
    - lnd-emulator
  soil_moisture:
    kind: state
    name: soil_moisture
    merge_type: direct
    attributes:
      attname: soil_moisture
      longname: Soil Moisture
      stdname: soil_moisture
      units: h2o kg m-2
    sources:
    - forcing-emulator
    destinations:
    - lnd-emulator
  surface_flux:
    kind: flux
    name: surface_flux
    merge_type: direct
    attributes:
      attname: surface_flux
      longname: Surface Flux to atm
      stdname: energy
      units: W m-2
    sources:
    - lnd-emulator
    destinations:
    - forcing-emulator
