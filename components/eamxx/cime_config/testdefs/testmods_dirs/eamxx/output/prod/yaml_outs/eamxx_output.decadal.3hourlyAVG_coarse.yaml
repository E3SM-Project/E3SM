%YAML 1.1
---
filename_prefix: eamxx_output.decadal.3hourlyAVG_coarse.h
iotype: pnetcdf
averaging_type: average
max_snapshots_per_file: 1 # only one snapshot per file
horiz_remap_file: ${DIN_LOC_ROOT}/atm/scream/maps/map_ne1024pg2_to_ne30pg2_mono.20230901.nc
fields:
  physics_pg2:
    field_names:
    # 3D fields
    - T_mid
    - qv
    - qc
    - qr
    - qi
    - cldfrac_tot
    - cldfrac_liq
    - omega
    - U
    - V
    - pseudo_density
    - z_mid
    # Surface
    - surf_sens_flux
    - surf_evap
    - surface_upward_latent_heat_flux
    - ps
    - precip_liq_surf_mass_flux
    - precip_ice_surf_mass_flux
    - surf_mom_flux
    - surf_radiative_T
    - T_2m
    - sfc_flux_dir_nir
    - sfc_flux_dir_vis
    - sfc_flux_dif_nir
    - sfc_flux_dif_vis
    - sfc_flux_sw_net
    - sfc_flux_lw_dn
    # Lowest Level
    - U_at_model_bot := U.isel(lev=-1)
    - V_at_model_bot := V.isel(lev=-1)
    - T_mid_at_model_bot := T_mid.isel(lev=-1)
    - qv_at_model_bot := qv.isel(lev=-1)
    - qc_at_model_bot := qc.isel(lev=-1)
    - qi_at_model_bot := qi.isel(lev=-1)
    - qr_at_model_bot := qr.isel(lev=-1)
    - qm_at_model_bot := qm.isel(lev=-1)
    - bm_at_model_bot := bm.isel(lev=-1)
    - SW_flux_up_at_model_top := SW_flux_up.isel(lev=0)
    - SW_flux_dn_at_model_top := SW_flux_dn.isel(lev=0)
    - LW_flux_up_at_model_top := LW_flux_up.isel(lev=0)
    - SW_clrsky_flux_up_at_model_top := SW_clrsky_flux_up.isel(lev=0)
    - LW_clrsky_flux_up_at_model_top := LW_clrsky_flux_up.isel(lev=0)
    - SW_flux_dn_at_model_bot := SW_flux_dn.isel(lev=-1)
    - SW_clrsky_flux_dn_at_model_bot := SW_clrsky_flux_dn.isel(lev=-1)
    - SW_flux_up_at_model_bot := SW_flux_up.isel(lev=-1)
    - SW_clrsky_flux_up_at_model_bot := SW_clrsky_flux_up.isel(lev=-1)
    - LW_flux_dn_at_model_bot := LW_flux_dn.isel(lev=-1)
    - LW_clrsky_flux_dn_at_model_bot := LW_clrsky_flux_dn.isel(lev=-1)
    - LW_flux_up_at_model_bot := LW_flux_up.isel(lev=-1)
    - LongwaveCloudForcing
    - ShortwaveCloudForcing
output_control:
  frequency: 3
  frequency_units: nhours
restart:
  force_new_file: true
