%YAML 1.1
---
driver_options:
  atmosphere_dag_verbosity_level: 5

time_stepping:
  run_t0: ${RUN_T0}  # YYYY-MM-DD-XXXXX

eamxx:
  atm_procs_list: [surface_coupling_importer,surface_coupling_exporter]
  schedule_type: sequential

grids_manager:
  type: mesh_free
  grids_names: [physics_gll]
  physics_gll:
    type: point_grid
    aliases: [physics]
    number_of_global_columns:   218
    number_of_vertical_levels:  72

initial_conditions:
  # The name of the file containing the initial conditions for this test.
  filename: ${SCREAM_DATA_DIR}/init/${EAMxx_tests_IC_FILE_72lev}
  topography_filename: ${TOPO_DATA_DIR}/${EAMxx_tests_TOPO_FILE}
  # Some fields needed for the exports (not in ic file)
  force_constant_fields:
    - "precip_ice_surf_mass=1"
    - "precip_liq_surf_mass=2"
    - "sfc_flux_sw_net=3"
    - "um_pert_diff=4"
    - "vm_pert_diff=5"
    - "tau_est=6"
    - "sfc_flux_dif_nir=0"
    - "sfc_flux_dif_vis=0"
    - "sfc_flux_dir_nir=0"
    - "sfc_flux_dir_vis=0"
    - "sfc_flux_lw_dn=0"

  # These fields are needed for the export,
  # but will be computed for the import

# The parameters for I/O control
scorpio:
  output_yaml_files: ["output.yaml"]
...
