%YAML 1.1
---
filename_prefix: p3_zm_mam4_wetscav_output
averaging_type: instant
field_names:
  # Cloud fraction
  - cldfrac_liq
  
  # Aerosol species - interstitial (a) modes
  - bc_a1
  - bc_a3
  - bc_a4
  - dst_a1
  - dst_a3
  - so4_a1
  - so4_a2
  - so4_a3
  - pom_a1
  - pom_a3
  - pom_a4
  - soa_a1
  - soa_a2
  - soa_a3
  - nacl_a1
  - nacl_a2
  - nacl_a3
  - mom_a1
  - mom_a2
  - mom_a3
  - mom_a4
  - num_a1
  - num_a2
  - num_a3
  - num_a4
  
  # Aerosol species - cloudborne (c) modes
  - bc_c1
  - bc_c3
  - bc_c4
  - dst_c1
  - dst_c3
  - so4_c1
  - so4_c2
  - so4_c3
  - pom_c1
  - pom_c3
  - pom_c4
  - soa_c1
  - soa_c2
  - soa_c3
  - nacl_c1
  - nacl_c2
  - nacl_c3
  - mom_c1
  - mom_c2
  - mom_c3
  - mom_c4
  - num_c1
  - num_c2
  - num_c3
  - num_c4
  
  # Wetscav outputs
  - aerdepwetis
  - aerdepwetcw
  - dgnumwet
  - dgnum
  - wetdens
  - qaerwat
  
  # ZM convection outputs
  - zm_detr_qc
  - zm_detr_qi
  - zm_cldtop_klev
  - zm_msemax_klev
  - zm_mflx_up
  - zm_mflx_dn
  - zm_entr_up
  - zm_detr_up
  - zm_entr_dn
  - zm_cape
  - zm_prec
  - zm_snow
  # ZM fields read by wetscav convective processing
  - zm_activity
  - zm_rain_prod
  - zm_icw_liq
  - zm_mass_flux_int
  - evap_dq_out

  # Wetscav convproc output
  - aerdepwetis_convproc

  # State and P3 fields read by wetscav (wetscav does not modify them,
  # so the end-of-step values are the values wetscav used)
  - T_mid
  - p_mid
  - pseudo_density
  - pseudo_density_dry
  - qv
  - qc
  - qi
  - nc
  - ni
  - precip_total_tend
  - nevapr

output_control:
  frequency: ${NUM_STEPS}
  frequency_units: nsteps
...
