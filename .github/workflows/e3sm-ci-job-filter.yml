name: e3sm-ci-job-filter

# Reusable workflow that decides which jobs of the calling workflow should run.
#
# Usage (in the calling workflow):
#
#   jobs:
#     job-filter:
#       uses: ./.github/workflows/e3sm-ci-job-filter.yml
#       with:
#         jobs: job-a, job-b, job-c
#         dispatch-input: job_to_run     # optional
#
#     job-a:
#       needs: job-filter
#       if: contains(fromJSON(needs.job-filter.outputs.jobs), 'job-a')
#       ...
#
# Selection rules, by event:
#   - pull_request:       no jobs if the PR is a draft (and skip-drafts is true), else all jobs
#   - workflow_dispatch:  if 'dispatch-input' names an input of the caller, run the job it
#                         selects ('all' or empty means all jobs; unknown job names fail)
#                         else all jobs
#   - any other event:    all jobs

on:
  workflow_call:
    inputs:
      jobs:
        description: 'Comma separated names of the jobs that this filter can select'
        required: true
        type: string
      dispatch-input:
        description: 'Name of the workflow_dispatch input used to select a job ("all" or empty = all jobs)'
        required: false
        type: string
        default: ''
      skip-drafts:
        description: 'Run no jobs on draft pull requests'
        required: false
        type: boolean
        default: true
    outputs:
      jobs:
        description: 'JSON array with the names of the jobs to run'
        value: ${{ jobs.filter.outputs.jobs }}
      any:
        description: '"true" if at least one job must run'
        value: ${{ jobs.filter.outputs.any }}

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - name: Select jobs
        id: select
        shell: bash
        env:
          ALL_JOBS: ${{ inputs.jobs }}
          DISPATCH_INPUT: ${{ inputs.dispatch-input }}
          SKIP_DRAFTS: ${{ inputs.skip-drafts }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # Comma separated list -> JSON array (trim spaces, drop empty entries)
          all=$(jq -cn --arg s "$ALL_JOBS" '$s | split(",") | map(gsub("^\\s+|\\s+$"; "") | select(length > 0))')
          selected=$all
          reason="$GITHUB_EVENT_NAME event"

          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$SKIP_DRAFTS" == true && "$IS_DRAFT" == true ]]; then
            selected='[]'
            reason="draft pull request"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$DISPATCH_INPUT" ]]; then
            choice=$(jq -r --arg n "$DISPATCH_INPUT" '.inputs[$n] // "all"' "$GITHUB_EVENT_PATH")
            reason="dispatch input '$DISPATCH_INPUT' is '$choice'"
            if [[ "$choice" != all ]]; then
              # Exact match, so that e.g. 'gnu' does not select 'gnugpu'
              selected=$(jq -cn --argjson a "$all" --arg c "$choice" '[$a[] | select(. == $c)]')
              if [[ "$selected" == '[]' ]]; then
                echo "::error::Dispatch input '$DISPATCH_INPUT'='$choice' is not one of: $all, or 'all'"
                exit 1
              fi
            fi
          fi

          echo "Selected jobs ($reason): $selected"
          echo "jobs=$selected" >> "$GITHUB_OUTPUT"
          echo "any=$(jq -r 'length > 0' <<< "$selected")" >> "$GITHUB_OUTPUT"
          {
            echo "### Job selection"
            echo
            echo "Reason: $reason"
            echo
            echo "| Job | Run |"
            echo "|---|---|"
            jq -r --argjson s "$selected" '.[] as $j | "| \($j) | \(if $s | index($j) then "yes" else "no" end) |"' <<< "$all"
          } >> "$GITHUB_STEP_SUMMARY"
