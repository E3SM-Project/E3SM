name: eamxx-v1

on:
  # Runs on all PRs (the filter [master] would prevent testing stacked PRs)
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      # first, yes to these
      - '.github/workflows/eamxx-v1-testing.yml'
      - 'cime_config/machines/config_machines.xml'
      - 'cime_config/machines/cmake_macros/ghci*.cmake'
      - 'components/eamxx/**'
      - 'components/homme/**'
      - 'components/eam/src/physics/rrtmgp/**'
      - 'components/eam/src/physics/cosp2/**'
      - 'externals/ekat'
      - 'externals/mam4xx'
      - 'externals/haero'
      - 'externals/scorpio'
      # second, no to these
      - '!components/eamxx/.clang-format'
      - '!components/eamxx/docs/**'
      - '!components/eamxx/mkdocs.yml'

  # Manual run is used to bless
  workflow_dispatch:
    inputs:
      bless:
        description: 'Generate baselines'
        required: true
        type: boolean

  # Also run nightly
  schedule:
    - cron: '0 7 * * *'  # Runs at 7 AM UTC, which is midnight MT during Standard Time

defaults:
  run:
    shell: bash -leo pipefail {0}

concurrency:
  # Two runs are in the same group if they are testing the same git ref
  #  - if trigger=pull_request, the ref is refs/pull/<PR_NUMBER>/merge
  #  - for other triggers, the ref is the branch tested
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Submit to cdash only for nightlies or if the user explicitly forced a submission via workflow dispatch
  submit: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch') }}
  # Generate only if user requested via workflow_dispatch
  generate: ${{ github.event_name == 'workflow_dispatch' && inputs.bless }}
  # Compare/generate flags for create_test
  flags: ${{ github.event_name == 'workflow_dispatch' && inputs.bless && '-o -g -b master' || '-c -b master' }}

jobs:
  tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: [self-hosted, e3sm, '${{ matrix.runner }}']
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: hip, name: ERS.ne4pg2_ne4pg2.F2010-SCREAMv1.ghci_gnu-hip.eamxx-output-prod}
    name: ${{ matrix.name }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          show-progress: false
          submodules: recursive
      - name: Show action trigger
        uses: e3sm-project/automation/show-trigger@v1
      - name: Run test
        id: run-tests
        run: |
          ./cime/scripts/create_test ${{ matrix.name }} ${{ env.flags }} --wait
      - name: HIP diagnostics (temporary)
        if: ${{ always() }}
        run: |
          echo "::group::env"; env | grep -i -E 'hip|rocm|hsa|gcc|xnack|^PATH|LD_LIBRARY|MPICH|OMPI' | sort; echo "::endgroup::"
          echo "::group::hipcc"; which -a hipcc; hipcc --version 2>&1 | head -20; echo "::endgroup::"
          echo "::group::rocminfo ISA"; rocminfo | grep -E 'Marketing|Name:.*(gfx|amdgcn)|XNACK'; echo "::endgroup::"
          for d in /tmp/${{ matrix.name }}*; do
            exe="$d/bld/e3sm.exe"
            [ -x "$exe" ] || continue
            echo "::group::ldd $exe (hip/hsa/rocm/stdc++)"; ldd "$exe" | grep -i -E 'hip|hsa|rocm|amd|stdc|gcc_s'; echo "::endgroup::"
            echo "::group::amdgcn targets embedded in e3sm.exe"
            strings -a "$exe" | grep -o -E 'amdgcn-amd-amdhsa-+[a-z0-9:+-]+' | sort | uniq -c
            echo "::endgroup::"
            echo "::group::roc-obj-ls"; (roc-obj-ls "$exe" 2>&1 || /opt/rocm/bin/roc-obj-ls "$exe" 2>&1) | head -40; echo "::endgroup::"
          done
      - name: Print TestStatus.log
        if: ${{ always() && steps.run-tests.outcome == 'failure' }}
        run: |
          for f in /tmp/${{ matrix.name }}*/TestStatus.log; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
      - name: Upload log files
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs.${{ matrix.name }}
          path: |
            /tmp/${{ matrix.name }}*/TestStatus
            /tmp/${{ matrix.name }}*/TestStatus.log
            /tmp/${{ matrix.name }}*/bld/**/*.bldlog.*
            /tmp/${{ matrix.name }}*/bld/**/CMakeCache.txt
            /tmp/${{ matrix.name }}*/run/**/*.log.*
            /tmp/${{ matrix.name }}*/run/**/*.cprnc.out
          retention-days: 14
      - name: Upload nc files
        if: ${{ failure() && steps.run-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: outputs.${{ matrix.name }}
          path: |
            /tmp/${{ matrix.name }}*/run/**/*.nc*
          retention-days: 14