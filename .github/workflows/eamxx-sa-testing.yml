name: eamxx-sa

on:
  # Runs on all PRs (the filter [master] would prevent testing stacked PRs)
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      # first, yes to these
      - '.github/workflows/eamxx-sa-testing.yml'
      - '.github/actions/test-all-eamxx/**'
      - '.github/actions/get-cuda-arch/**'
      - 'cime_config/machine/config_machines.xml'
      - 'components/eamxx/**'
      - 'components/homme/**'
      - 'components/eam/src/physics/cosp2/external/**'
      - 'components/eam/src/physics/rrtmgp/**'
      - 'externals/ekat'
      - 'externals/mam4xx'
      - 'externals/haero'
      - 'externals/scorpio'
      # second, no to these
      - '!components/eamxx/.clang-format'
      - '!components/eamxx/docs/**'
      - '!components/eamxx/mkdocs.yml'
      - '!components/eamxx/cime_config/**'

  # Manual run is used to bless
  workflow_dispatch:
    inputs:
      bless:
        description: 'Generate baselines'
        required: true
        type: boolean
      submit:
        description: 'Force cdash submission'
        required: true
        type: boolean
      use_kokkos_dev:
        description: 'Run with Kokkos develop branch'
        required: true
        type: boolean

  # Add schedule trigger for nightly runs at midnight MT (Standard Time)
  schedule:
    - cron: '0 7 * * *'  # Runs at 7 AM UTC, which is midnight MT during Standard Time
    - cron: '0 7 * * 1'  # Weekly run every Monday at 7 AM UTC (using Kokkos develop branch)

concurrency:
  # Two runs are in the same group if they are testing the same git ref
  #  - if trigger=pull_request, the ref is refs/pull/<PR_NUMBER>/merge
  #  - for other triggers, the ref is the branch tested
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Submit to cdash only for nightlies or if the user explicitly forced a submission via workflow dispatch
  submit: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.submit) }}
  generate: ${{ github.event_name == 'workflow_dispatch' && inputs.bless }}
  # Do EKAT testing for nightlies or (TODO: if EKAT label is present)
  ekat: ${{ github.event_name == 'schedule' }}
  # For the weekly run, we test using the kokkos develop branch
  kokkos_dev_test: ${{ github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.use_kokkos_dev) }}

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  tests:
    runs-on: [self-hosted, e3sm, '${{ matrix.runner }}']
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: gnu-openmp, runner: gnu, build_type: sp, cmake_configs: 'Kokkos_ENABLE_OPENMP=ON'}
          - {name: gnu-openmp, runner: gnu, build_type: dbg, cmake_configs: 'Kokkos_ENABLE_OPENMP=ON'}
          - {name: gnu-openmp, runner: gnu, build_type: fpe, cmake_configs: 'Kokkos_ENABLE_OPENMP=ON'}
          - {name: gnu-openmp, runner: gnu, build_type: opt, cmake_configs: 'Kokkos_ENABLE_OPENMP=ON'}
          - {name: intel-openmp, runner: intel, build_type: opt, cmake_configs: 'Kokkos_ENABLE_OPENMP=ON'}
          - {name: gnu-cuda, runner: cuda, build_type: sp, cmake_configs: 'SCREAM_SMALL_KERNELS=OFF'}
          - {name: gnu-cuda, runner: cuda, build_type: dbg, cmake_configs: 'SCREAM_SMALL_KERNELS=ON'}
          - {name: gnu-cuda, runner: cuda, build_type: opt, cmake_configs: 'SCREAM_SMALL_KERNELS=OFF'}
    name: ${{ matrix.name }} / ${{ matrix.build_type }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          show-progress: false
          submodules: recursive
      - name: Show action trigger
        uses: ./.github/actions/show-workflow-trigger
      - name: Get CUDA Arch
        if: ${{ matrix.runner == 'cuda' }}
        uses: ./.github/actions/get-cuda-arch
      - name: Run tests
        uses: ./.github/actions/test-all-eamxx
        with:
          build_type: ${{ matrix.build_type }}
          machine: ghci-${{ matrix.runner }}
          generate: ${{ env.generate }}
          submit: ${{ env.submit }}
          cmake-configs: ${{ matrix.cmake_configs }};${{ env.CUDA_CMAKE_CONFIGS }}
          ekat: ${{ env.ekat }}
          kokkos_develop: ${{ env.kokkos_dev_test }}
