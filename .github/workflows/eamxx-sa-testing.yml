name: eamxx-sa

on:
  # [HUNT] throwaway branch: manual dispatch only
  workflow_dispatch:
    inputs:
      bless:
        description: 'Generate baselines (keep false!)'
        required: true
        type: boolean
        default: false
      submit:
        description: 'Force cdash submission'
        required: true
        type: boolean
        default: false
      use_kokkos_dev:
        description: 'Run with Kokkos develop branch'
        required: true
        type: boolean
        default: false
      repeats:
        description: 'How many times to run shoc_tests_omp1 within each job'
        required: false
        type: string
        default: '20'

concurrency:
  # Two runs are in the same group if they are testing the same git ref
  #  - if trigger=pull_request, the ref is refs/pull/<PR_NUMBER>/merge
  #  - for other triggers, the ref is the branch tested
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Submit to cdash only for nightlies or if the user explicitly forced a submission via workflow dispatch
  submit: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.submit) }}
  generate: ${{ github.event_name == 'workflow_dispatch' && inputs.bless }}
  # Do EKAT testing for nightlies or (TODO: if EKAT label is present)
  ekat: ${{ github.event_name == 'schedule' }}
  # For the weekly run, we test using the kokkos develop branch
  kokkos_dev_test: ${{ github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.use_kokkos_dev) }}

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: [self-hosted, e3sm, '${{ matrix.runner }}']
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: gnu-hip, runner: hip, build_type: sp, cmake_configs: 'SCREAM_SMALL_KERNELS=OFF'}
          - {name: gnu-hip, runner: hip, build_type: dbg, cmake_configs: 'SCREAM_SMALL_KERNELS=ON'}
    name: ${{ matrix.name }} / ${{ matrix.build_type }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          show-progress: false
          submodules: recursive
      - name: Show action trigger
        uses: e3sm-project/automation/show-trigger@v1
      - name: Get GPU Arch
        id: gpu
        if: ${{ matrix.runner == 'cuda' || matrix.runner == 'hip' }}
        uses: e3sm-project/automation/gpu-arch@v1
      - name: "[HUNT] Info on the shared baseline dir and the runner"
        run: |
          set +e
          echo "host: $(hostname)  date: $(date -u)"
          echo "--- mount info for /projects"
          df -h /projects/e3sm/data/baselines/scream/ghci-hip 2>&1 | head -5
          mount | grep -E " /projects| /projects/e3sm" | head -5
          for d in /projects/e3sm/data/baselines/scream/ghci-hip/*/; do
            echo "=== $d"
            ls -la --time-style=full-iso "$d" | head -8
            echo -n "baseline_git_sha: "; cat "$d/baseline_git_sha" 2>/dev/null; echo
            ls -la --time-style=full-iso "$d/data" 2>/dev/null | grep -i "shoc_tests\|shoc_unit" | head -5
          done
          echo "--- gpu"
          rocminfo 2>/dev/null | grep -c "Name: *gfx" || true
          env | grep -E "HIP_|ROCR_|OMP_|HSA_" || true
      - name: "[HUNT] 1/3 GENERATE a local baseline (shoc_tests only)"
        uses: ./.github/actions/test-all-eamxx
        env:
          SCREAM_BASELINE_DIR: LOCAL
          SCREAM_BUILD_TARGET: shoc_tests
          SCREAM_TEST_REGEX: '^shoc_tests$'
          SCREAM_TEST_REPEAT: 1
        with:
          build_type: ${{ matrix.build_type }}
          machine: ghci-${{ matrix.runner }}
          generate: 'true'
          submit: 'false'
          cmake-configs: ${{ matrix.cmake_configs }};${{ steps.gpu.outputs.cmake-configs }}
          tag: -1-gen-local
      - name: "[HUNT] 2/3 COMPARE against the local baseline, N times"
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-all-eamxx
        env:
          SCREAM_BASELINE_DIR: LOCAL
          SCREAM_BUILD_TARGET: shoc_tests
          SCREAM_TEST_REGEX: '^shoc_tests_omp1$'
          SCREAM_TEST_REPEAT: ${{ inputs.repeats }}
        with:
          build_type: ${{ matrix.build_type }}
          machine: ghci-${{ matrix.runner }}
          generate: 'false'
          submit: 'false'
          cmake-configs: ${{ matrix.cmake_configs }};${{ steps.gpu.outputs.cmake-configs }}
          tag: -2-cmp-local
      - name: "[HUNT] 3/3 COMPARE against the shared (AUTO) baseline, N times"
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-all-eamxx
        env:
          SCREAM_BUILD_TARGET: shoc_tests
          SCREAM_TEST_REGEX: '^shoc_tests_omp1$'
          SCREAM_TEST_REPEAT: ${{ inputs.repeats }}
        with:
          build_type: ${{ matrix.build_type }}
          machine: ghci-${{ matrix.runner }}
          generate: 'false'
          submit: 'false'
          cmake-configs: ${{ matrix.cmake_configs }};${{ steps.gpu.outputs.cmake-configs }}
          tag: -3-cmp-shared
