# Field Limits Dictionary
#
# Physical limits on fields that components send to the coupler (c2x). A
# component checks the fields it sends against these limits, and the fields it
# receives against the limits set by their sender (share/util/shr_bounds_mod.F90,
# called from the component's coupler interface). Each
# entry is keyed by the coupler field name defined in
# driver-mct/shr/seq_flds_mod.F90 (and driver-moab) and records:
#
#   component      : the component that sends the field (atm, lnd, ice, ocn, ...)
#   units          : units, in the coupler's convention (as in seq_flds_mod)
#   owner          : who owns the limit (the component that knows the physics)
#
# and exactly one of:
#
#   min, max       : limits; omit either for no limit on that side. Optional:
#     min_inclusive,
#     max_inclusive  : whether the limit value itself is allowed (default: true)
#     where_positive : coupler field of the same component; the check only
#                      applies where that field is > 0 (e.g. ice fraction)
#     reason         : why the limit holds, where it isn't obvious
#   unbounded      : "<reason>"; the field was reviewed and no limit applies
#   status         : unreviewed; a field that existed before this dictionary and
#                    has not been reviewed yet. New fields may not use it.
#
# Every field a component sends to the coupler must have an entry: the model
# stops at startup if one does not (shr_bounds_require, called from seq_flds_set).
# A name ending in '*' is a pattern for names that seq_flds_set builds at
# startup from namelist settings: 'Sl_dd*' matches Sl_dd followed by digits
# (Sl_dd001, Sl_dd002, ...); a comment next to it says how the names are built.
# Fields defined by users (cplflds_custom, carma_fields) need no entry.
#
# Signs follow the coupler convention: fluxes are positive downward (into the
# surface), so upward longwave (lwup) is negative.
#
# Do not edit share/util/shr_field_limits_mod.F90 by hand. After editing this
# file, regenerate it with:
#
#   python share/gen_field_limits.py
#
# The generator checks each entry's keys and limits. With --base, it also fails
# if a field is unreviewed here but not in the base file.

