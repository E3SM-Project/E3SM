files: ^components/omega/
repos:
  - repo: https://github.com/Takishima/cmake-pre-commit-hooks
    rev: v1.9.6
    hooks:
      - id: clang-format
        args: ["-i"]
      # - id: clang-tidy
      #   args: [--checks=readability-magic-numbers,--warnings-as-errors=*]
      # - id: cppcheck
      # - id: include-what-you-use

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # Can run individually with `flynt [file]` or `flynt [source]`
  - repo: https://github.com/ikamensh/flynt
    rev: 1.0.6
    hooks:
      - id: flynt
        args: ["--fail-on-change", "--verbose", "--line-length=79"]
        require_serial: true

  # Can run individually with `pre-commit run ruff-check --all-files` or
  # `pre-commit run ruff-format --all-files`.  Both are configured in
  # components/omega/ruff.toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # Run the linter.
      - id: ruff-check
        args: ["--fix"]
      # Run the formatter.
      - id: ruff-format

  # Can run individually with `pre-commit run mypy --all-files`
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: ["--config=components/omega/mypy.cfg", "--show-error-codes"]
        verbose: true
        additional_dependencies: ['types-requests']
        exclude: ^components/omega/cime_config/build.*

  # Can run individually with `pre-commit run fortitude --all-files`
  - repo: https://github.com/PlasmaFAIR/fortitude-pre-commit
    rev: v0.8.0
    hooks:
      - id: fortitude
        args: ["--config-file=components/omega/.fortitude.toml", "--fix", "--preview"]

  # Can run individually with `pre-commit run fprettify --all-files`
  - repo: https://github.com/fortran-lang/fprettify
    rev: v0.3.7
    hooks:
      - id: fprettify
        files: \.[fF](90|95|03|08)$
        args: ["--indent", "3"]
